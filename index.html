<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>フラッシュことば</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Kosugi Maru', system-ui, sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
      min-height: 100vh;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px 16px;
      box-sizing: border-box;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .screen.active { display: flex; }

    h1 { font-size: 2.2rem; margin-bottom: 12px; }
    p { line-height: 1.6; }

    .field { margin: 16px 0; position: relative; width: 100%; max-width: 400px; margin-left: auto; margin-right: auto; }

    /* 入力欄のスタイル修正 */
    input[type="text"], input[type="password"] {
      font-size: 1.2rem;
      padding: 8px 12px;
      width: 100%;
      box-sizing: border-box;
    }

    /* 目隠しボタンのスタイル */
    .mask-toggle {
      margin-top: 8px;
      font-size: 0.9rem;
      color: #007aff;
      text-decoration: underline;
      cursor: pointer;
      display: inline-block;
    }

    .levels {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .level-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #888;
      background: #fff;
      cursor: pointer;
      min-width: 80px;
    }

    .level-btn.selected {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    button.main {
      margin-top: 20px;
      font-size: 1.2rem;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }

    .flash-word {
      font-size: 4rem; /* 少し大きくしました */
      font-weight: bold;
    }

    .countdown {
      font-size: 5rem;
      font-weight: bold;
    }

    .white {
      background: #fff;
      justify-content: center; /* 中央寄せ */
    }

    /* こたえ画面の調整 */
    #result h2 { margin-bottom: 30px; }
  </style>
</head>

<body>
  <div id="home" class="screen active">
    <h1>フラッシュことば</h1>
    <p>
      一瞬だけ見えることばを見て、なんて書いてあったかを答えるゲームです。
    </p>

    <div class="field">
      <label>問題：</label><br>
      <input type="text" id="wordInput" placeholder="表示させたい言葉を入力">
      <span class="mask-toggle" id="maskToggle">●●●で隠す</span>
    </div>

    <div style="margin-top:12px;">ひとりで ちょうせんする</div>
    <div class="levels" id="soloButtons">
      <div class="level-btn" data-len="1">1もじ</div>
      <div class="level-btn" data-len="2">2もじ</div>
      <div class="level-btn" data-len="3">3もじ</div>
      <div class="level-btn" data-len="4">4もじ</div>
      <div class="level-btn" data-len="5">5もじ</div>
      <div class="level-btn" data-len="6">6もじいじょう</div>
    </div>

    <div style="margin-top:12px;">難易度（表示時間）：</div>
    <div class="levels" id="levelButtons"></div>

    <button class="main" id="startBtn">出題</button>
  </div>

  <div id="wait" class="screen">
    <div style="margin-top: 40vh;">
      <p style="font-size: 1.5rem;">画面をタッチすると<br>出題します</p>
    </div>
  </div>

  <div id="play" class="screen white">
    <div id="playContent"></div>
  </div>

  <div id="result" class="screen">
    <h2>こたえはわかりましたか？</h2>
    <div style="margin-bottom: 10px;">もう一度見る（難易度変更可）</div>
    <div class="levels" id="replayLevels"></div>
    
    <div style="margin-top: 20px;">
      <button class="main" id="showAnswerBtn">こたえを表示</button>
      <button class="main" style="background:#888;" onclick="location.reload()">最初にもどる</button>
    </div>
  </div>

  <script src="words-hiragana1.js"></script>
  <script src="words-hiragana2.js"></script>
  <script src="words-hiragana3.js"></script>
  <script src="words-hiragana4.js"></script>
  <script src="words-hiragana5.js"></script>
  <script src="words-hiraganaSentences.js"></script>

  <script>
    const levels = [
      { name: 'かんたん', time: 1000 },
      { name: 'ふつう', time: 600 },
      { name: 'ちょいむず', time: 400 },
      { name: 'げきむず', time: 200 },
      { name: 'チャンピオン', time: 50 },
    ];

    let selectedLevel = levels[0];
    let currentWord = '';
    let selectedLists = [];

    const home = document.getElementById('home');
    const wait = document.getElementById('wait');
    const play = document.getElementById('play');
    const playContent = document.getElementById('playContent');
    const result = document.getElementById('result');
    const wordInput = document.getElementById('wordInput');
    const maskToggle = document.getElementById('maskToggle');

    // 画面切り替え
    function showScreen(screen) {
      [home, wait, play, result].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    // ① 目隠し機能の実装
    maskToggle.onclick = () => {
      if (wordInput.type === "text") {
        wordInput.type = "password";
        maskToggle.textContent = "表示する";
      } else {
        wordInput.type = "text";
        maskToggle.textContent = "●●●で隠す";
      }
    };

    // 難易度ボタンの生成
    function renderLevelButtons(container) {
      container.innerHTML = '';
      levels.forEach(lv => {
        const btn = document.createElement('div');
        btn.className = 'level-btn' + (lv.name === selectedLevel.name ? ' selected' : '');
        btn.textContent = lv.name;
        btn.onclick = (e) => {
          e.stopPropagation(); // 親のクリックイベント伝播を防止
          selectedLevel = lv;
          renderLevelButtons(document.getElementById('levelButtons'));
          renderLevelButtons(document.getElementById('replayLevels'));
        };
        container.appendChild(btn);
      });
    }

    renderLevelButtons(document.getElementById('levelButtons'));
    renderLevelButtons(document.getElementById('replayLevels'));

    // ひとりモードの選択
    document.querySelectorAll('#soloButtons .level-btn').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('selected');
        const len = btn.dataset.len;
        if (btn.classList.contains('selected')) {
          selectedLists.push(len);
        } else {
          selectedLists = selectedLists.filter(v => v !== len);
        }
      };
    });

    // ② 画面遷移の自動化
    document.getElementById('startBtn').onclick = () => {
      const input = wordInput.value.trim();

      if (selectedLists.length > 0) {
        let pool = [];
        // リストが存在するかチェックしながら結合
        if (selectedLists.includes("1") && typeof hiragana1 !== 'undefined') pool = pool.concat(hiragana1);
        if (selectedLists.includes("2") && typeof hiragana2 !== 'undefined') pool = pool.concat(hiragana2);
        if (selectedLists.includes("3") && typeof hiragana3 !== 'undefined') pool = pool.concat(hiragana3);
        if (selectedLists.includes("4") && typeof hiragana4 !== 'undefined') pool = pool.concat(hiragana4);
        if (selectedLists.includes("5") && typeof hiragana5 !== 'undefined') pool = pool.concat(hiragana5);
        if (selectedLists.includes("6") && typeof hiraganaSentences !== 'undefined') pool = pool.concat(hiraganaSentences);

        if (pool.length === 0) {
          alert("ワードリストが見つかりません。jsファイルを確認してください。");
          return;
        }
        currentWord = pool[Math.floor(Math.random() * pool.length)];
      } else if (input) {
        currentWord = input;
      } else {
        alert("問題を入力するか、文字数を選んでください");
        return;
      }

      showScreen(wait); // 待機画面へ
    };

    // 待機画面をタッチしたらカウントダウン開始
    wait.onclick = () => startCountdown();

    function startCountdown() {
      showScreen(play);
      let count = 3;
      playContent.textContent = count;
      playContent.className = 'countdown';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          playContent.textContent = count;
        } else {
          clearInterval(timer);
          showWord();
        }
      }, 1000);
    }

    function showWord() {
      playContent.className = 'flash-word';
      playContent.textContent = currentWord;
      
      setTimeout(() => {
        playContent.textContent = '';
        // 出題終了から2秒後にリザルト画面へ自動移動
        setTimeout(() => showScreen(result), 1000);
      }, selectedLevel.time);
    }

    // 答えの表示
    document.getElementById('showAnswerBtn').onclick = () => {
      showScreen(play);
      playContent.className = 'flash-word';
      playContent.textContent = currentWord;
      
      // 答え画面では、画面をクリックしたらホームに戻るように設定
      setTimeout(() => {
        play.onclick = () => {
          play.onclick = null;
          showScreen(home);
        };
      }, 500);
    };

    // 「もう一度見る」のための設定：リザルト画面の難易度ボタンを押したときにすぐ再開したい場合はここを調整
    document.getElementById('replayLevels').onclick = () => {
      // 難易度を選び直して再度「待機画面」から開始
      showScreen(wait);
    };
  </script>
</body>
</html>
