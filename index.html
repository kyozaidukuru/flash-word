<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>フラッシュことば</title>

  <style>
    /* ========================================
       デザインシステム（共通変数）
       ======================================== */
    :root {
        --primary-color: #FFB6C1;      /* やさしいピンク */
        --secondary-color: #FFE4B5;    /* もこもこオレンジ */
        --accent-color: #87CEEB;       /* さわやかブルー */
        --success-color: #98FB98;      /* やさしい緑 */
        --warning-color: #FFD700;      /* きらきら黄色 */
        --text-color: #4A4A4A;         /* 優しい黒 */
        --bg-color: #FFFAF0;           /* あたたかい白 */
        --shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', 'Meiryo', sans-serif;
        background: linear-gradient(135deg, #FFF5E6 0%, #FFE4E1 100%);
        color: var(--text-color);
        text-align: center;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 各画面コンテナ */
    .screen {
        display: none;
        width: 90%;
        max-width: 600px;
        background: white;
        padding: 40px 20px;
        border-radius: 30px;
        box-shadow: var(--shadow);
        box-sizing: border-box;
    }
    .screen.active { display: flex; flex-direction: column; align-items: center; }

    h1, h2 { color: var(--text-color); margin-bottom: 20px; }
    
    /* フォーム周り */
    .field { margin: 20px 0; width: 100%; }
    #wordInput {
        font-size: 1.2rem;
        padding: 15px;
        width: 100%;
        border: 3px solid var(--primary-color);
        border-radius: 15px;
        box-sizing: border-box;
        text-align: center;
        margin-top: 10px;
    }

    .mask-toggle {
        margin-top: 10px;
        font-size: 0.9rem;
        color: var(--accent-color);
        font-weight: bold;
        cursor: pointer;
    }

    /* ボタン群 */
    .levels {
        display: flex;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 15px 0;
    }

    .level-btn {
        padding: 12px 20px;
        border-radius: 15px;
        border: 2px solid var(--accent-color);
        background: white;
        cursor: pointer;
        font-weight: bold;
        transition: all 0.2s ease;
    }
    .level-btn.selected {
        background: var(--accent-color);
        color: white;
        border-color: var(--accent-color);
    }

    button.main {
        margin-top: 20px;
        padding: 15px 40px;
        font-size: 1.2rem;
        font-weight: bold;
        border: none;
        border-radius: 20px;
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
        color: white;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: var(--shadow);
    }
    button.main:hover { transform: translateY(-3px); filter: brightness(1.1); }

    /* フラッシュ表示用 */
    .flash-word { font-size: 4rem; font-weight: bold; color: var(--text-color); }
    .countdown { font-size: 5rem; font-weight: bold; color: var(--accent-color); }

    /* 目隠し用CSS */
    .masked { -webkit-text-security: disc; text-security: disc; }
  </style>
</head>

<body>

  <div id="home" class="screen active">
    <h1>フラッシュことば</h1>
    <p>すこしだけ　みえる　ことばを　あてよう！</p>

    <div class="field">
      <label>もんだい：</label>
      <input type="text" id="wordInput" placeholder="ことばを　いれるか　　  したから　えらぶ">
      <div class="mask-toggle" id="maskToggle">●●●でかくす</div>
    </div>

    <div>ひとりで ちょうせんする</div>
    <div class="levels" id="soloButtons">
      <div class="level-btn" data-len="1">1もじ</div>
      <div class="level-btn" data-len="2">2もじ</div>
      <div class="level-btn" data-len="3">3もじ</div>
      <div class="level-btn" data-len="4">4もじ</div>
      <div class="level-btn" data-len="5">5もじ</div>
      <div class="level-btn" data-len="6">6もじいじょう</div>
    </div>

    <div>みえる　じかんを　えらぶ</div>
    <div class="levels" id="levelButtons"></div>

    <button class="main" id="startBtn">はじめる</button>
  </div>

  <div id="wait" class="screen">
    <p style="font-size: 1.5rem; margin-top: 20px;">がめんをタッチすると<br>はじまります</p>
  </div>

  <div id="play" class="screen">
    <div id="playContent"></div>
  </div>

  <div id="result" class="screen">
    <h2>こたえは　わかったかな？</h2>
    <div style="margin-bottom: 10px;">もういちど　みる</div>
    <div id="replayLevels" class="levels"></div>
    
    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
      <button class="main" id="showAnswerBtn">こたえを　みる</button>
      <button class="main" style="background:#888;" onclick="location.reload()">さいしょに　もどる</button>
    </div>
  </div>

  <script src="words-hiragana1.js"></script>
  <script src="words-hiragana2.js"></script>
  <script src="words-hiragana3.js"></script>
  <script src="words-hiragana4.js"></script>
  <script src="words-hiragana5.js"></script>
  <script src="words-hiraganaSentences.js"></script>

  <script>
    /* （以下、JavaScriptは元のロジックをそのまま活用してください） */
    const levels = [
      { name: '3びょう', time: 3000 },
      { name: '1びょう', time: 1000 },
      { name: '0.6びょう', time: 600 },
      { name: '0.2びょう', time: 200 },
      { name: '0.05びょう', time: 50 },
    ];

    let selectedLevel = levels[0];
    let currentWord = '';
    let selectedLists = [];

    const home = document.getElementById('home');
    const wait = document.getElementById('wait');
    const play = document.getElementById('play');
    const playContent = document.getElementById('playContent');
    const result = document.getElementById('result');
    const wordInput = document.getElementById('wordInput');
    const maskToggle = document.getElementById('maskToggle');

    function showScreen(screen) {
      [home, wait, play, result].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    maskToggle.onclick = () => {
      wordInput.classList.toggle('masked');
      maskToggle.textContent = wordInput.classList.contains('masked') ? "ひょうじする" : "●●●でかくす";
    };

    function renderLevelButtons(container) {
      container.innerHTML = '';
      levels.forEach(lv => {
        const btn = document.createElement('div');
        btn.className = 'level-btn' + (lv.name === selectedLevel.name ? ' selected' : '');
        btn.textContent = lv.name;
        btn.onclick = (e) => {
          e.stopPropagation();
          selectedLevel = lv;
          renderLevelButtons(document.getElementById('levelButtons'));
          renderLevelButtons(document.getElementById('replayLevels'));
          if (container.id === 'replayLevels') { showScreen(wait); }
        };
        container.appendChild(btn);
      });
    }

    renderLevelButtons(document.getElementById('levelButtons'));
    renderLevelButtons(document.getElementById('replayLevels'));

    document.querySelectorAll('#soloButtons .level-btn').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('selected');
        const len = btn.dataset.len;
        if (btn.classList.contains('selected')) {
          selectedLists.push(len);
        } else {
          selectedLists = selectedLists.filter(v => v !== len);
        }
      };
    });

    document.getElementById('startBtn').onclick = () => {
      const input = wordInput.value.trim();
      if (selectedLists.length > 0) {
        let pool = [];
        try {
          if (selectedLists.includes("1")) pool = pool.concat(hiragana1);
          if (selectedLists.includes("2")) pool = pool.concat(hiragana2);
          if (selectedLists.includes("3")) pool = pool.concat(hiragana3);
          if (selectedLists.includes("4")) pool = pool.concat(hiragana4);
          if (selectedLists.includes("5")) pool = pool.concat(hiragana5);
          if (selectedLists.includes("6")) pool = pool.concat(hiraganaLong);
        } catch(e) { alert("ワードリストの読み込みに失敗しました。"); return; }
        currentWord = pool[Math.floor(Math.random() * pool.length)];
      } else if (input) {
        currentWord = input;
      } else {
        alert("問題を入力するか、文字数を選んでください");
        return;
      }
      showScreen(wait);
    };

    wait.onclick = () => startCountdown();

    function startCountdown() {
      showScreen(play);
      let count = 3;
      playContent.textContent = count;
      playContent.className = 'countdown';
      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          playContent.textContent = count;
        } else {
          clearInterval(timer);
          showWord();
        }
      }, 1000);
    }

    function showWord() {
      playContent.className = 'flash-word';
      playContent.textContent = currentWord;
      setTimeout(() => {
        playContent.textContent = '';
        setTimeout(() => showScreen(result), 1000);
      }, selectedLevel.time);
    }

    document.getElementById('showAnswerBtn').onclick = () => {
      showScreen(play);
      playContent.className = 'flash-word';
      playContent.textContent = currentWord;
      setTimeout(() => {
        play.onclick = () => {
          play.onclick = null;
          showScreen(home);
        };
      }, 500);
    };
  </script>
</body>
</html>
