<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>フラッシュことば</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Kosugi Maru', system-ui, sans-serif;
      background: #f7f7f7;
      color: #222;
      text-align: center;
      min-height: 100vh;
    }

    .screen {
      display: none;
      min-height: 100vh;
      padding: 24px 16px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    .screen.active { display: flex; }

    h1 { font-size: 2.2rem; margin-bottom: 12px; }
    p { line-height: 1.6; }

    .field { margin: 16px 0; }

    input[type="text"] {
      font-size: 1.2rem;
      padding: 8px 12px;
      width: 90%;
      max-width: 400px;
    }

    .levels {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }

    .level-btn {
      padding: 10px 12px;
      border-radius: 8px;
      border: 2px solid #888;
      background: #fff;
      cursor: pointer;
      min-width: 80px;
    }

    .level-btn.selected {
      background: #333;
      color: #fff;
      border-color: #333;
    }

    button.main {
      margin-top: 20px;
      font-size: 1.2rem;
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }

    .flash-word {
      font-size: 3rem;
      font-weight: bold;
    }

    .countdown {
      font-size: 3rem;
    }

    .white {
      background: #fff;
    }
  </style>
</head>

<body>
  <!-- ホーム画面 -->
  <div id="home" class="screen active">
    <h1>フラッシュことば</h1>
    <p>
      一瞬だけ見えることばを見て、なんて書いてあったかを答えるゲームです。<br>
      問題を入力するか、ひとりモードで自動出題もできます。
    </p>

    <div class="field">
      <label>問題：</label><br>
      <input type="text" id="wordInput" placeholder="表示させたい言葉を入力">
    </div>

    <div style="margin-top:12px;">ひとりで ちょうせんする</div>
    <div class="levels" id="soloButtons">
      <div class="level-btn" data-len="1">1もじ</div>
      <div class="level-btn" data-len="2">2もじ</div>
      <div class="level-btn" data-len="3">3もじ</div>
      <div class="level-btn" data-len="4">4もじ</div>
      <div class="level-btn" data-len="5">5もじ</div>
      <div class="level-btn" data-len="6">6もじいじょう</div>
    </div>

    <div style="margin-top:12px;">難易度：</div>
    <div class="levels" id="levelButtons"></div>

    <button class="main" id="startBtn">出題</button>
  </div>

  <!-- 待機画面 -->
  <div id="wait" class="screen">
    <p>画面をタッチすると出題します</p>
  </div>

  <!-- カウントダウン・出題画面 -->
  <div id="play" class="screen white">
    <div id="playContent"></div>
  </div>

  <!-- 結果画面 -->
  <div id="result" class="screen">
    <h2>もう一度見る</h2>
    <div class="levels" id="replayLevels"></div>
    <button class="main" id="showAnswerBtn">こたえ</button>
  </div>

  <!-- ワードリスト -->
  <script src="words-hiragana1.js"></script>
  <script src="words-hiragana2.js"></script>
  <script src="words-hiragana3.js"></script>
  <script src="words-hiragana4.js"></script>
  <script src="words-hiragana5.js"></script>
  <script src="words-hiraganaSentences.js"></script>

  <script>
    const levels = [
      { name: 'かんたん', time: 1000 },
      { name: 'ふつう', time: 600 },
      { name: 'ちょいむず', time: 400 },
      { name: 'げきむず', time: 200 },
      { name: 'チャンピオン', time: 50 },
    ];

    let selectedLevel = levels[0];
    let currentWord = '';
    let selectedLists = [];

    const home = document.getElementById('home');
    const wait = document.getElementById('wait');
    const play = document.getElementById('play');
    const playContent = document.getElementById('playContent');
    const result = document.getElementById('result');

    function showScreen(screen) {
      [home, wait, play, result].forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function renderLevelButtons(container) {
      container.innerHTML = '';
      levels.forEach(lv => {
        const btn = document.createElement('div');
        btn.className = 'level-btn' + (lv === selectedLevel ? ' selected' : '');
        btn.textContent = lv.name;
        btn.onclick = () => {
          selectedLevel = lv;
          renderLevelButtons(container);
        };
        container.appendChild(btn);
      });
    }

    renderLevelButtons(document.getElementById('levelButtons'));
    renderLevelButtons(document.getElementById('replayLevels'));

    document.querySelectorAll('#soloButtons .level-btn').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('selected');
        const len = btn.dataset.len;
        if (btn.classList.contains('selected')) {
          selectedLists.push(len);
        } else {
          selectedLists = selectedLists.filter(v => v !== len);
        }
      };
    });

    document.getElementById('startBtn').onclick = () => {
      const input = document.getElementById('wordInput').value.trim();

      if (selectedLists.length > 0) {
        let pool = [];
        if (selectedLists.includes("1")) pool = pool.concat(hiragana1);
        if (selectedLists.includes("2")) pool = pool.concat(hiragana2);
        if (selectedLists.includes("3")) pool = pool.concat(hiragana3);
        if (selectedLists.includes("4")) pool = pool.concat(hiragana4);
        if (selectedLists.includes("5")) pool = pool.concat(hiragana5);
        if (selectedLists.includes("6")) pool = pool.concat(hiraganaSentences);

        currentWord = pool[Math.floor(Math.random() * pool.length)];
      } else if (input) {
        currentWord = input;
      } else {
        alert("問題を入力するか、文字数を選んでください");
        return;
      }

      showScreen(wait);
    };

    wait.onclick = () => startCountdown();

    function startCountdown() {
      showScreen(play);
      let count = 3;
      playContent.textContent = count;
      playContent.className = 'countdown';

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          playContent.textContent = count;
        } else {
          clearInterval(timer);
          showWord();
        }
      }, 1000);
    }

    function showWord() {
      playContent.className = 'flash-word';
      playContent.textContent = currentWord;
      setTimeout(() => {
        playContent.textContent = '';
        setTimeout(() => showScreen(result), 2000);
      }, selectedLevel.time);
    }

    document.getElementById('showAnswerBtn').onclick = () => {
      showScreen(play);
      playContent.className = 'flash-word';
      playContent.textContent = currentWord;
      play.onclick = () => {
        play.onclick = null;
        showScreen(home);
      };
    };
  </script>
</body>
</html>
